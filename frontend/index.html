<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise AI 知识库</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 900px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
  .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 25px; text-align: center; }
  h2 { color: white; font-weight: 600; font-size: 24px; }
  .subtitle { color: rgba(255, 255, 255, 0.85); font-size: 14px; margin-top: 8px; }
  .content { padding: 25px; }

  /* 上传区 */
  #uploadTipContainer { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
  .upload-tip { background: #f8f9fa; padding: 14px 18px; border-radius: 12px; border: 1px solid #e9ecef; display: flex; align-items: center; gap: 12px; transition: all 0.3s ease; }
  .upload-tip span:first-child { font-size: 14px; color: #495057; min-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .upload-tip progress { flex: 1; height: 8px; border-radius: 4px; border: none; }
  .upload-tip progress::-webkit-progress-bar { background: #e9ecef; border-radius: 4px; }
  .upload-tip progress::-webkit-progress-value { background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; transition: width 0.3s ease; }
  .upload-status { font-size: 13px; color: #6c757d; min-width: 120px; text-align: right; }

  /* 聊天区 */
  #chatBox { min-height: 450px; max-height: 600px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; margin-bottom: 25px; padding: 20px; background: #f8f9fa; border-radius: 16px; border: 1px solid #e9ecef; }
  #chatBox::-webkit-scrollbar { width: 6px; }
  #chatBox::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
  .message { padding: 14px 18px; border-radius: 16px; max-width: 75%; line-height: 1.7; font-size: 15px; word-wrap: break-word; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .msg-user { align-self: flex-end; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
  .msg-ai { align-self: flex-start; background: white; color: #2c3e50; border: 1px solid #e9ecef; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); }
  .msg-ai pre { background: #f8f9fa; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
  .msg-ai code { font-family: Consolas, monospace; font-size: 14px; }

  /* 系统状态 */
  .sys-status { font-size: 13px; color: #e67e22; background: #fff3cd; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #e67e22; }

  /* 输入区 */
  .input-area { display: flex; gap: 12px; align-items: center; padding: 15px; background: #f8f9fa; border-radius: 16px; border: 1px solid #e9ecef; }
  #fileInput { display: none; }
  .upload-icon-btn { width: 48px; height: 48px; font-size: 28px; border-radius: 12px; background-color: white; color: #667eea; border: 1px solid #e9ecef; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; flex-shrink: 0; }
  .upload-icon-btn:hover { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; transform: scale(1.05); }
  select { padding: 14px; border: 1px solid #e9ecef; border-radius: 12px; outline: none; background: white; font-weight: bold; color: #667eea; cursor: pointer; }
  input[type="text"] { flex: 1; padding: 14px 18px; border: 1px solid #e9ecef; border-radius: 12px; outline: none; font-size: 15px; background: white; }
  input[type="text"]:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
  #sendBtn { padding: 14px 28px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 15px; flex-shrink: 0; }
  #sendBtn:disabled { background: #95a5a6; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>📁 企业级 AI 知识库</h2>
    <div class="subtitle">支持批量上传PDF/Word/Excel/Text文档，智能问答</div>
  </div>

  <div class="content">
    <!-- 上传进度提示容器 -->
    <div id="uploadTipContainer"></div>

    <!-- 聊天区 -->
    <div id="chatBox">
      <div class="message msg-ai">你好！点击左侧加号按钮批量上传文档，或者直接向我提问。<br><small style="color: #6c757d;">支持格式：.pdf .txt .docx .csv .xlsx .xls</small></div>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
      <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.csv,.xlsx,.xls" multiple>
      <div class="upload-icon-btn" title="上传文件" onclick="document.getElementById('fileInput').click()">+</div>

      <!-- 模式切换 -->
      <select id="chatMode">
        <option value="agent">🤖 Agent 模式</option>
        <option value="rag">📚 纯 RAG 模式</option>
      </select>

      <input type="text" id="question" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter') ask()">
      <button id="sendBtn" onclick="ask()">发送</button>
    </div>
  </div>
</div>

<script>
// 先从浏览器缓存拿，拿不到才生成新的
let SESSION_ID = localStorage.getItem("chat_session_id");
if (!SESSION_ID) {
    SESSION_ID = "user_" + Math.random().toString(36).substring(7);
    localStorage.setItem("chat_session_id", SESSION_ID);
}
const chatBox = document.getElementById('chatBox');
const fileInput = document.getElementById('fileInput');
const sendBtn = document.getElementById('sendBtn');
const questionInput = document.getElementById('question');

// ================= 1. 文件批量上传逻辑 =================
fileInput.addEventListener('change', async function() {
  const files = this.files;
  if (files.length === 0) return;

  const formData = new FormData();
  for (const file of files) {
    formData.append("files", file); // 匹配后端的 files
  }

  // 创建批量上传进度提示
  const progressMap = new Map();
  for (const file of files) {
    const tipDiv = document.createElement('div');
    tipDiv.className = 'upload-tip';
    tipDiv.innerHTML = `
      <span title="${file.name}">📄 ${file.name}</span>
      <progress value="0" max="100"></progress>
      <span class="upload-status">等待上传...</span>
    `;
    document.getElementById('uploadTipContainer').appendChild(tipDiv);
    progressMap.set(file.name, {
      bar: tipDiv.querySelector('progress'),
      text: tipDiv.querySelector('.upload-status'),
      div: tipDiv
    });
  }

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    if (!res.ok) {
        const errText = await res.text();
        throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const data = await res.json();

    // 为每个任务启动进度轮询
    data.tasks.forEach(taskInfo => {
      const item = progressMap.get(taskInfo.filename);
      if (!item) return;

      item.text.innerText = "解析中...";
      const timer = setInterval(async () => {
        try {
            const taskRes = await fetch(`/api/task/${taskInfo.task_id}`);
            const taskData = await taskRes.json();

            if (taskData.state === 'PROGRESS') {
              item.bar.value = taskData.progress || 0;
              item.text.innerText = `${taskData.message || '处理中'} (${taskData.progress || 0}%)`;
            } else if (taskData.state === 'SUCCESS') {
              clearInterval(timer);
              item.bar.value = 100;
              item.text.innerText = "✅ 完成";
              item.div.style.background = '#f8fff9';
              item.div.style.borderColor = '#d4edda';
              setTimeout(() => item.div.remove(), 3000);
            } else if (taskData.state === 'FAILURE') {
              clearInterval(timer);
              item.text.innerText = "❌ 失败";
              item.div.style.background = '#fff8f8';
              item.div.style.borderColor = '#f8d7da';
            }
        } catch(e) {
            clearInterval(timer);
        }
      }, 1500);
    });
  } catch (err) {
    alert("上传失败：" + err.message);
    // 清除失败的进度条
    progressMap.forEach(item => item.div.remove());
  } finally {
    fileInput.value = ''; // 清空以便下次选择
  }
});

// ================= 2. 问答逻辑 (流式解析 + 模式切换) =================
function addMessage(content, isUser = false) {
  const div = document.createElement('div');
  div.className = `message ${isUser ? 'msg-user' : 'msg-ai'}`;
  div.innerHTML = isUser ? content : marked.parse(content);
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

async function ask() {
  const question = questionInput.value.trim();
  const mode = document.getElementById('chatMode').value;
  if (!question) return;

  sendBtn.disabled = true;
  questionInput.disabled = true;

  addMessage(question, true);
  questionInput.value = '';

  // 创建 AI 消息框
  const aiDiv = addMessage("思考中...");
  let fullText = "";
  let sysHtml = "";

  // --- Markdown 渲染节流器 ---
  let isRendering = false;
  function renderMarkdown() {
    if (isRendering) return;
    isRendering = true;

    // 使用 requestAnimationFrame 优化渲染性能
    requestAnimationFrame(() => {
      let contentHtml = sysHtml;

      if (fullText) {
        // 【核心修复1】一旦有了正文，立刻清空系统提示的小黄框
        sysHtml = "";
        try {
          // 尝试解析 Markdown
          contentHtml = marked.parse(fullText);
        } catch (e) {
          // 【核心修复2】流式输出时可能会有未闭合的语法（比如刚打出 ** ），导致解析报错
          // 报错时直接降级显示纯文本，保证不崩溃
          contentHtml = fullText;
        }
      } else if (!sysHtml) {
        contentHtml = "思考中...";
      }

      aiDiv.innerHTML = contentHtml;
      chatBox.scrollTop = chatBox.scrollHeight;
      isRendering = false;
    });
  }

  try {
    // 根据模式切换请求的接口
    const apiUrl = mode === 'agent' ? '/api/chat/agent' : '/api/chat/rag';

    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID, question: question })
    });

    if (!res.ok) throw new Error("请求后端接口失败");

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      let parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (let part of parts) {
        if (part.startsWith('data: ')) {
          let text = part.substring(6).replace(/\ndata: /g, "\n");
          if (text === '[DONE]') continue;

          if (text.startsWith('[SYS]')) {
             // 这里只在没有正文的时候更新 sysHtml
            if (!fullText) {
               sysHtml = `<div class="sys-status">${text.replace('[SYS] ', '')}</div>`;}
          } else {
            // 过滤可能的乱码标签
            text = text.replace(/<\s*\|.*?DSML.*?\|.*?>/gs, "");
            fullText += text;
          }

          // 每次收到数据，调用渲染函数（内部有节流控制，不会卡）
          renderMarkdown();
        }
      }
    }

    // 流结束后，最后一次完整渲染（确保 Markdown 语法彻底闭合）
    if (fullText) {
        aiDiv.innerHTML = marked.parse(fullText);
    } else if (sysHtml) {
        aiDiv.innerHTML = sysHtml + `<div style="color:#e74c3c; margin-top:10px;">⚠️ 生成最终文本失败。</div>`;
    } else {
        aiDiv.innerHTML = "抱歉，我没有理解你的问题。";
    }

  } catch (err) {
    aiDiv.innerHTML = `<span style="color:red">❌ 请求出错：${err.message}</span>`;
  } finally {
    sendBtn.disabled = false;
    questionInput.disabled = false;
    questionInput.focus();
  }
}
</script>

</body>
</html>
